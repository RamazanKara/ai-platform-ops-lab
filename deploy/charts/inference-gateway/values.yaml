replicaCount: 1

image:
  repository: ghcr.io/ramazankara/private-ai-platform-kit/inference-gateway
  # First-party image: release CI pins the published digest (set image.digest) after build.
  tag: "v0.28.0"
  pullPolicy: IfNotPresent

runtime:
  backend: ollama
  modelId: qwen3.5:0.8b
  ollamaBaseUrl: http://ollama.ollama.svc.cluster.local:11434
  vllmBaseUrl: http://vllm.vllm.svc.cluster.local:8000
  requestTimeoutSeconds: "120"
  maxRetries: 2
  retryBackoffSeconds: "0.1"
  circuitFailureThreshold: 0
  circuitResetSeconds: "30"
  allowedModels:
    - qwen3.5:0.8b

routing:
  policyPath: ""
  policy:
    enabled: false
    models: []

sandboxPolicy:
  policyPath: ""
  policy:
    enabled: false
    policies: []

admission:
  maxMessages: 16
  maxPromptChars: 8192
  # Maximum JSON request body before parsing. Files uploads use batch.maxFileBytes.
  maxRequestBodyBytes: 1048576
  maxCompletionTokens: 1024
  # Cap on the OpenAI `n` parameter (completions per request); the completion budget is
  # charged n times so a caller cannot request many completions for the price of one.
  maxCompletionsPerRequest: 1
  # Flat token estimate charged per image_url content part so multimodal prompts are
  # metered rather than counting as zero toward the budget.
  imagePartTokenEstimate: 768
  # Maximum decoded size (bytes) of a single data-URL image part; 0 disables the check.
  maxImageBytes: 0
  maxTools: 64
  maxToolChars: 32768
  # Streaming is shipped on so chat UIs and coding agents work out of the box; the
  # regulated-offline profile turns it off where end-of-stream-only guardrails matter.
  allowStreaming: true

# Short-window per-sandbox request throttle (distinct from the cumulative budget).
# Uses the same backend as budgets (budget.backend); 0 requests means unlimited.
# Disabled by default.
rateLimit:
  enabled: false
  requestsPerWindow: 0
  windowSeconds: 60
  # Availability-vs-enforcement tradeoff when backend=redis. If the shared rate-limit
  # backend (Redis) is unreachable, the limiter fails CLOSED by default (503 for all
  # traffic, matching the budget tracker). Set true to fail OPEN instead: admit the
  # request with a logged warning and the inference_gateway_rate_limit_fail_open_total
  # metric, for operators who prefer availability over the throttle during a Redis
  # outage. Budgets stay fail-closed regardless of this flag.
  failOpen: false

# Bounded in-flight concurrency: requests beyond the limit are shed with 503 (not
# queued). 0 disables the limit.
concurrency:
  maxConcurrentRequests: 0
  # Maximum chat requests accepted in one POST /v1/batch-inference call.
  maxBatchRequests: 32

# Exact-match per-sandbox response cache for non-streaming chat completions.
# backend: "memory" (per-replica) or "redis" (shared across replicas; recommended under
# horizontal scale-out so the hit rate does not collapse as the gateway scales).
responseCache:
  enabled: false
  ttlSeconds: 60
  maxEntries: 1024
  backend: memory
  redisUrl: redis://budget-redis.budget.svc.cluster.local:6379/1
  redisTimeoutSeconds: "0.5"
  keyPrefix: private-ai-platform-kit:response-cache

# Token-to-cost model surfaced by GET /v1/usage. 0 disables the cost estimate.
cost:
  usdPer1kTokens: 0
  currency: USD

guardrails:
  promptSecretDetection:
    enabled: true
    # Action on a match: "block" (reject the request - the fail-closed default),
    # "redact" (replace matched spans before forwarding so an agent reading a .env or
    # lockfile is not killed mid-conversation), or "flag" (allow and record only).
    mode: block
    # Built-in detectors applied to prompt/embedding input. Credential detectors are
    # the default; add the PII detectors (email, us_ssn, credit_card) to reject PII.
    patterns:
      - private_key
      - github_token
      - slack_token
      - aws_access_key_id
      - google_api_key
      - bearer_token
      - generic_api_key_assignment
  # Case-insensitive substrings rejected anywhere in input (e.g. project codenames).
  # Empty disables the denylist.
  blockedContentTerms: []
  # Output-side guardrail: inspect the model completion before returning it (OWASP
  # LLM02:2025 sensitive information disclosure / LLM05:2025 improper output handling).
  # mode: "flag"
  # (record only), "redact" (replace matched spans), or "block" (withhold content and set
  # finish_reason=content_filter). Scans the credential + PII detectors plus blockedContentTerms.
  # Disabled by default. Streaming responses are detected-and-flagged only (bytes are already
  # in flight); use non-streaming for redact/block enforcement.
  outputGuardrail:
    enabled: false
    mode: redact
    patterns:
      - private_key
      - github_token
      - slack_token
      - aws_access_key_id
      - google_api_key
      - bearer_token
      - generic_api_key_assignment
      - email
      - us_ssn
      - credit_card

budget:
  enabled: true
  backend: memory
  requestLimit: 1000
  promptCharLimit: "2000000"
  estimatedTokenLimit: 750000
  estimatedCharsPerToken: 4
  windowSeconds: 86400
  redisUrl: redis://budget-redis.budget.svc.cluster.local:6379/0
  redisTimeoutSeconds: "0.5"
  keyPrefix: private-ai-platform-kit:sandbox-budget

# Asynchronous OpenAI Files + Batch API (ADR 0011). Off by default: enabling it needs an object
# store for the JSONL blobs and a Redis-backed store + queue for durable job state, plus the
# batch-processor worker (deployed separately). Use the s3 object-store backend in-cluster; the
# filesystem backend is for single-node/local runs and needs a writable volume.
batch:
  enabled: false
  objectStore:
    backend: filesystem
    root: /var/lib/inference-gateway/batch
    s3:
      endpointUrl: ""
      bucket: ""
      region: us-east-1
      accessKeyId: ""
      secretAccessKey: ""
      # In production source the secret key from an existing Secret rather than values.
      existingSecret:
        name: ""
        key: s3-secret-access-key
  store:
    backend: memory
    redisUrl: redis://budget-redis.budget.svc.cluster.local:6379/2
    redisTimeoutSeconds: "0.5"
    keyPrefix: private-ai-platform-kit:batch
  maxFileBytes: 104857600
  maxRequestsPerBatch: 50000
  completionWindow: "24h"
  retentionSeconds: 604800
  # The batch-processor worker: a second Deployment from this same image, run with
  # `python -m app.batch_worker`. It drains the queue and replays each item back through the
  # gateway, so governance stays single-sourced. Only deployed when batch.enabled is true.
  worker:
    enabled: true
    replicaCount: 1
    concurrency: 4
    pollSeconds: "2"
    reclaimSeconds: "300"
    requestTimeoutSeconds: "120"
    # Empty defaults to the in-cluster gateway service URL.
    gatewayUrl: ""
    # Service API key the worker presents to the gateway when auth is enabled; sourced from a
    # Secret. Leave name empty when the gateway does not require auth.
    apiKey:
      existingSecret:
        name: ""
        key: batch-worker-api-key
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        cpu: 500m
        memory: 256Mi

# Server-side Responses API state (ADR 0012). Off by default. When enabled, `store: true` and
# `previous_response_id` on POST /v1/responses persist RAW conversation content (opt-in,
# tenant-scoped, TTL-bounded) and the GET/DELETE/input_items routes are served. Keep it off (or
# set a short retention) for regulated data. Uses its own Redis logical DB.
responses:
  store:
    enabled: false
    backend: memory
    redisUrl: redis://budget-redis.budget.svc.cluster.local:6379/3
    redisTimeoutSeconds: "0.5"
    keyPrefix: private-ai-platform-kit:responses
    retentionSeconds: 86400

# Opt-in read-only admin console served by the gateway at /console (ADR 0013). Off by default.
# It reuses the governed read-only endpoints (usage, budget, models, health).
adminConsole:
  enabled: false

traceability:
  auditLogEnabled: true
  defaultSandboxId: local-lab
  auditChainStore:
    # Persisting the chain head lets a restarted pod open its chain with a record naming
    # the previous chain and its head, so a deleted lifetime stops looking like a restart.
    # "memory" keeps the pre-continuity behavior and is the default, because durable
    # storage for it is the operator's to provide.
    backend: memory
    path: /var/lib/inference-gateway/audit-chain-head.json
    redisUrl: redis://budget-redis.budget.svc.cluster.local:6379/0
    key: inference-gateway:audit-chain-head
    timeoutSeconds: "0.5"
    # Coalesced, so a head-store write never sits on the request path.
    persistIntervalSeconds: "5"

receipts:
  # Agent-action receipt intake (ADR 0014): POST /v1/receipts records what a workspace did
  # beyond calling a model onto the same hash chain. Off by default; it records claims and
  # enforces nothing, so a deployment with no receipt producers gains nothing by exposing it.
  enabled: false
  maxFieldChars: 256

auth:
  enabled: false
  apiKeyHeader: X-API-Key
  apiKeyHashes: []
  existingSecret:
    name: ""
    key: api-key-sha256s
  # Optional richer API-key records (per-key scopes, expiry, sandbox binding, and budget
  # overrides) beside the flat apiKeyHashes list. A flat hash stays an unbound, unexpiring,
  # unscoped key. The records file is sensitive (it maps key hashes to tenant bindings), so
  # it is mounted from an existing Secret rather than templated into values. A malformed
  # file fails the gateway closed at startup. Leave existingSecret.name empty to disable.
  keyRecords:
    existingSecret:
      name: ""
      key: key-records.json
    # Directory the records Secret is mounted into; the file is <mountPath>/<existingSecret.key>.
    mountPath: /etc/private-ai-platform-kit/auth
  # Explicit path override for API_KEY_RECORDS_PATH when NOT using keyRecords.existingSecret
  # (e.g. a records file supplied by a sidecar or a different volume). Empty disables records.
  keyRecordsPath: ""
  jwt:
    enabled: false
    jwksUrl: ""
    issuer: ""
    audience: ""
    requiredScopes: []
    cacheSeconds: 300
    # When set, the named JWT claim binds the sandbox id: a mismatched or missing
    # X-Sandbox-ID is rejected so per-sandbox budget/policy/attribution cannot be
    # spoofed via the client header. Empty disables binding (header-trusted).
    tenantClaim: ""

service:
  port: 8080

# Optional Ingress for cluster-external clients. Disabled by default (port-forward only).
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls:
    enabled: false
    secretName: ""

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podLabels:
  platform.ai/cost-center: platform
  platform.ai/environment: local
  platform.ai/owner: platform-team
  platform.ai/sandbox-id: local-lab

serviceMonitor:
  enabled: true
  interval: 30s

podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

networkPolicy:
  enabled: true
  # monitoring must stay listed: the Prometheus scrape (ServiceMonitor) and the KEDA
  # scaler's query source both go dark on a NetworkPolicy-enforcing CNI without it.
  allowedIngressNamespaces:
    - ai-agents
    - ai-sandbox
    - monitoring
  allowedIngressNamespaceLabels:
    - platform.ai/traceable-sandbox: "true"
  runtimeEgress:
    - namespace: ollama
      port: 11434
    - namespace: vllm
      port: 8000
    - namespace: budget
      port: 6379
  allowDns: true

keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 5
  prometheusServerAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
  # Aggregate request rate across every governed /v1 API and every status.
  threshold: "10"
  # Independent saturation signals; KEDA scales when any trigger is above target.
  inflightThreshold: "20"
  loadShedRateThreshold: "0.1"
  p95LatencyThresholdSeconds: "5"

observability:
  tracing:
    enabled: false
    otlpEndpoint: ""
    serviceName: inference-gateway

# `helm test` connection probe. Rendered for validation; only created by `helm test`.
tests:
  enabled: true
  image:
    repository: busybox
    # tag is kept as documentation; digest pins the multi-arch manifest list.
    tag: "1.37.0"
    digest: "sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028"

# Data-plane namespace with an apiserver-native Pod Security Admission restricted floor.
# create=false when the namespace is managed elsewhere; name defaults to the release namespace.
namespace:
  create: true
  name: ""
