apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: expired-egress-exception
  namespace: tenant-a
  labels:
    platform.ai/egress-governed: "true"
  annotations:
    # A catalog entry that lapsed while its NetworkPolicy stayed applied. Before the
    # expiry rules existed this kept allowing traffic until somebody edited the repo.
    platform.ai/egress-expires-on: "2020-01-01"
    platform.ai/egress-catalog-refs: customer-git-artifact-mirror-example
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 203.0.113.0/24
      ports:
        - protocol: TCP
          port: 443
